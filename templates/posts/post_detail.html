{% extends 'layout.html' %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block title %}{{ self.title }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div style="max-width: 760px; margin: 0 auto;">

        <!-- 文章标题（可选） -->
        <h1 style="font-size: 2.4rem; margin-bottom: 1.5rem;">{{ self.title }}</h1>

        <!-- 正文内容 -->
        <div class="post-body prose prose-lg max-w-none" 
             style="font-size: 1.13rem; line-height: 1.85; color: #222;">
            
            {% for block in self.body %}
                {% include_block block %}
            {% endfor %}

        </div>

        <hr class="my-5">

    </div>
</div>
{% endblock %}
